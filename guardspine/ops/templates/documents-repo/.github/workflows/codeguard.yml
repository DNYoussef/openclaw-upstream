name: GuardSpine Document Governance
on:
  pull_request:
    paths: ["pdfs/**", "sheets/**", "images/**"]

permissions:
  pull-requests: write
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: DNYoussef/codeguard-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          guardspine_url: ${{ secrets.GUARDSPINE_API_URL }}
