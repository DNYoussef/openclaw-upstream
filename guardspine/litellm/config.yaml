# ============================================================
# LiteLLM Proxy Config — ALL routes via OpenRouter
# ============================================================
# Single API key: OPENROUTER_API_KEY
# Single billing point: openrouter.ai
# Updated: 2026-03-29
# ============================================================

model_list:
  # --- Tier 1: Anthropic Claude (via OpenRouter) ---
  - model_name: opus-4.6
    litellm_params:
      model: openrouter/anthropic/claude-opus-4.6
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: sonnet-4.6
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4.6
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: haiku
    litellm_params:
      model: openrouter/anthropic/claude-haiku-4.5
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Tier 1: OpenAI GPT (via OpenRouter) ---
  - model_name: gpt-5.4
    litellm_params:
      model: openrouter/openai/gpt-5.4
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: gpt-5.4-mini
    litellm_params:
      model: openrouter/openai/gpt-5.4-mini
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: gpt-5.4-nano
    litellm_params:
      model: openrouter/openai/gpt-5.4-nano
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Tier 1: Google Gemini (via OpenRouter) ---
  - model_name: gemini-flash
    litellm_params:
      model: openrouter/google/gemini-2.5-flash
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: gemini-pro
    litellm_params:
      model: openrouter/google/gemini-2.5-pro
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Tier 2: Open-source / specialty (via OpenRouter) ---
  - model_name: deepseek-v3
    litellm_params:
      model: openrouter/deepseek/deepseek-v3.2
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: llama-70b
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: os.environ/OPENROUTER_API_KEY

  # --- MiroFish simulation model (cheap/free) ---
  - model_name: free-sim
    litellm_params:
      model: openrouter/meta-llama/llama-3.2-3b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: deepseek-chat
    litellm_params:
      model: openrouter/deepseek/deepseek-v3.2
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Legacy aliases (keep existing agent requests working) ---
  - model_name: openrouter/deepseek/deepseek-v3.2
    litellm_params:
      model: openrouter/deepseek/deepseek-v3.2
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter/google/gemini-2.0-flash-001
    litellm_params:
      model: openrouter/google/gemini-2.5-flash
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter/meta-llama/llama-3.3-70b-instruct
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: openrouter/openai/gpt-4o-mini
    litellm_params:
      model: openrouter/openai/gpt-5.4-mini
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openrouter/openai/gpt-5.4-mini
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Embedding models (via OpenRouter) ---
  - model_name: text-embedding-3-small
    litellm_params:
      model: openrouter/openai/text-embedding-3-small
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: text-embedding-004
    litellm_params:
      model: openrouter/openai/text-embedding-3-small
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Wildcard: any model not listed above passes through to OpenRouter ---
  - model_name: "*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 60
  fallbacks:
    # Tier 1 cascades: same-class then cross-provider
    - opus-4.6: [sonnet-4.6, gpt-5.4, gemini-pro]
    - sonnet-4.6: [haiku, gpt-5.4-mini, gemini-flash]
    - haiku: [gpt-5.4-mini, gemini-flash]
    - gpt-5.4: [sonnet-4.6, gemini-pro]
    - gpt-5.4-mini: [haiku, gemini-flash]
    - gpt-5.4-nano: [gpt-5.4-mini, gemini-flash]
    - gemini-flash: [haiku, gpt-5.4-mini]
    - gemini-pro: [sonnet-4.6, gpt-5.4]
    # Tier 2 cascades
    - deepseek-v3: [haiku, gemini-flash]
    - llama-70b: [haiku, gemini-flash]
    # Legacy alias cascades
    - openrouter/deepseek/deepseek-v3.2: [haiku, gemini-flash]
    - openrouter/google/gemini-2.0-flash-001: [gemini-flash, haiku]
    - openrouter/meta-llama/llama-3.3-70b-instruct: [haiku, gemini-flash]
    - openrouter/openai/gpt-4o-mini: [gpt-5.4-mini, haiku]

litellm_settings:
  drop_params: True
  # OpenRouter metadata for tracking
  default_headers:
    HTTP-Referer: "https://guardspine.com"
    X-Title: "GuardSpine"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
