name: Backup n8n Workflows

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Export n8n workflows
        env:
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          chmod +x guardspine/scripts/backup/backup-n8n-flows.sh
          guardspine/scripts/backup/backup-n8n-flows.sh

      - name: Push changes
        run: |
          # Script already handles git config + commit.
          # Just push if there are new commits.
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse @{u} 2>/dev/null || echo '')" ]; then
            git push
          else
            echo "No new commits to push."
          fi
